name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install -r requirements.txt
      - name: Test
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python -m unittest test_regressions.py
          python -m py_compile main.py config.py pet_stats.py pet_animation.py pet_menu.py pet_window.py pet_startup.py pet_keyboard_overlay.py test_regressions.py
      - name: Build
        run: |
          python -m PyInstaller --onefile --noconsole --name LineDogPet --icon "assets\icon.ico" --add-data "assets;assets" main.py
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/LineDogPet.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
